  services:
    db:
      image: mysql:8.0
      container_name: hotel-mysql
      environment:
        MYSQL_ROOT_PASSWORD: rootpassword
        MYSQL_DATABASE: hotel_db
      ports:
        - "3307:3306"
      volumes:
        - mysql-data:/var/lib/mysql
      healthcheck:
        test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 20s

    app:
      build: .
      container_name: hotel-app
      depends_on:
        db:
          condition: service_healthy
      environment:
        SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/hotel_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        SPRING_DATASOURCE_USERNAME: root
        SPRING_DATASOURCE_PASSWORD: rootpassword
        SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
        SPRING_JPA_HIBERNATE_DDL_AUTO: none
        SPRING_SQL_INIT_MODE: always
      ports:
        - "8080:8080"

  volumes:
    mysql-data: